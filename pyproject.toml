[project]
name = "physai"
version = "0.3.0"
description = "IA interpretável para eventos extremos"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HelioAI" },
]
license = { text = "MIT" }
keywords = ["ai", "xai", "time-series", "physics", "extreme-events"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "xarray>=2024.3",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.optional-dependencies]
# Extras opcionais para uso específico.
synthetic = [
  "pyyaml>=6.0",
]
data = [
  "fsspec>=2024.1",
  "h5netcdf>=1.3",
]
explain = [
  "captum>=0.6",
  "shap>=0.45",
]
report = [
  "jupyter>=1.0",
  "nbformat>=5.9",
]
all = [
  "physai[synthetic,data,explain,report]",
]

[project.scripts]
physai = "pacote.cli.commands:main"

[project.entry-points."pacote.plugins"]
# Plugins podem ser adicionados aqui conforme a API evolui.
synthetic = "pacote.synthetic:register"
methods = "pacote.methods:register"
models = "pacote.models:register"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacote"]

[tool.uv]
package = true

[tool.uv.sources]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "nox>=2024.3",
  "pre-commit>=3.7",
  "mkdocs>=1.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["pacote"]
warn_unused_configs = true
